<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fingerprint Encrypter</title>
  <link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: url('https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEiFVfM4K5nG_IIbyIxivm9QZNZnXzJKaxUrhJZXpbC1rdcC5Y8fIz0mJoTL53YG8PaHI_heB0d4a7gmVM6JkL4591DQgd8Wb5BJ9AUqAlDpnNm4Qz1QXfgMdpBEk_ADw0T4JcvuM4aKcf6KNpmPhXzaT6DEoWR766I7FwOx7xB4NE-isLxu_TkeFyd7epKF/s1536/1000024787.png') no-repeat center center fixed;
      background-size: cover;
      font-family: Arial, sans-serif;
      color: #ffffff;
      text-align: center;
      padding: 60px 20px;
    }
    h1 {
      font-family: 'UnifrakturCook', cursive;
      font-size: 3rem;
    }
    .description {
      font-size: 1.25rem;
      margin: 20px 0;
    }
    .get-started img {
      width: 220px;
      cursor: pointer;
    }
    .upload-section {
      margin: 40px 0 20px;
    }
    .upload-section label {
      font-size: 1.2rem;
    }
    input[type="file"] {
      margin-top: 10px;
    }
    #fileName, #fingerName {
      margin-top: 10px;
      font-style: italic;
    }
    .btn-finish {
      font-size: 1.2rem;
      padding: 12px 24px;
      background-color: #007BFF;
      border: none;
      color: #fff;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 30px;
    }
    #downloadLink {
      display: none;
      margin-top: 25px;
      font-size: 1.1rem;
    }
    #downloadLink a {
      color: #00FF00;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h1>FINGERPRINT ENCRYPTER</h1>
  <p class="description">You can encrypt your file for free here using fingerprint, it is fast and secure</p>

  <div class="upload-section">
    <label for="fileInput">Upload your file:</label><br/>
    <input type="file" id="fileInput"/>
    <div id="fileName"></div>
  </div>

  <div class="upload-section">
    <label for="fingerprintInput">Upload your fingerprint:</label><br/>
    <input type="file" id="fingerprintInput"/>
    <div id="fingerName"></div>
  </div>

  <button id="finishBtn" class="btn-finish">Finish</button>

  <div id="downloadLink">
    <a id="downloadAnchor" href="#" download="encrypted_file.enc">Download Encrypted File</a>
  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const fingerprintInput = document.getElementById('fingerprintInput');
    const fileNameDiv = document.getElementById('fileName');
    const fingerNameDiv = document.getElementById('fingerName');
    const finishBtn = document.getElementById('finishBtn');
    const downloadLinkDiv = document.getElementById('downloadLink');
    const downloadAnchor = document.getElementById('downloadAnchor');

    fileInput.addEventListener('change', () => {
      fileNameDiv.textContent = 'File: ' + fileInput.files[0].name;
    });
    fingerprintInput.addEventListener('change', () => {
      fingerNameDiv.textContent = 'Fingerprint File: ' + fingerprintInput.files[0].name;
    });

    finishBtn.addEventListener('click', () => {
      finishBtn.disabled = true;
      finishBtn.textContent = 'Encrypting...';
      setTimeout(() => {
        const blob = new Blob(['ERROR: Unable to decrypt. File corrupted.'], { type: 'application/octet-stream' });
        const url = URL.createObjectURL(blob);
        downloadAnchor.href = url;
        downloadLinkDiv.style.display = 'block';
        finishBtn.textContent = 'Done';
      }, 5000);
    });
  </script>
</body>
</html>
